name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          PKGS="git zip unzip autoconf automake libtool zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential"

          # Pre-emptively switch to the reliable archive mirror and enable universe
          sudo tee /etc/apt/sources.list <<EOF
          deb http://archive.ubuntu.com/ubuntu/ jammy main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu/ jammy-updates main restricted universe multiverse
          deb http://archive.ubuntu.com/ubuntu/ jammy-security main restricted universe multiverse
          EOF

          for attempt in 1 2 3; do
            sudo apt-get update -y || true
            if sudo apt-get install -y --fix-missing $PKGS; then
              exit 0
            fi
            echo "apt attempt $attempt failed, retrying in 30 seconds"
            sleep 30
          done

          echo "Final attempt with force fix-broken"
          sudo apt --fix-broken install -y
          sudo apt-get install -y --fix-missing $PKGS

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Cache build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pseudo-clinic-apk
          path: bin/*.apk
