name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          PKGS="git zip unzip autoconf automake libtool zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev build-essential ccache"
          for attempt in 1 2 3; do
            sudo apt-get update || true
            if sudo apt-get install -y --fix-missing $PKGS; then
              exit 0
            fi
            echo "apt attempt $attempt failed, retrying in 30 seconds"
            sleep 30
          done
          echo "Falling back to the direct Ubuntu mirror"
          sudo sed -i 's|mirror+file:/etc/apt/apt-mirrors.txt|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list || true
          sudo apt-get update
          sudo apt-get install -y --fix-missing $PKGS

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython

      - name: Cache build files
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build debug APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          echo "===== COPY EVERYTHING FROM HERE TO THE END MARKER AND SEND IT BACK ====="
          sed -i 's/\x1b\[[0-9;]*[A-Za-z]//g' build.log
          N=$(grep -n "# Command failed" build.log | head -1 | cut -d: -f1)
          if [ -n "$N" ]; then
            START=$(( N > 70 ? N - 70 : 1 ))
            sed -n "${START},$((N - 1))p" build.log
            echo "----- the command that failed -----"
            sed -n "${N},$((N + 1))p" build.log | cut -c1-300
          else
            tail -n 70 build.log
          fi
          echo "===== END MARKER ====="

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pseudo-clinic-apk
          path: bin/*.apk
